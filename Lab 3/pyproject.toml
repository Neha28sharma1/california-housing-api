[project]
name = "lab-3"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Neha Sharma", email = "neha28.sharma1@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "huggingface-hub>=2.2.0",
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "requests>=2.34.2",
    "safetensors>=0.8.0",
    "scikit-learn>=1.9.1",
    "streamlit>=1.66.1",
    "torch>=2.14.1",
    "uvicorn>=0.54.0",
    "xgboost>=3.4.1",
]

[project.scripts]
lab-3 = "lab_3:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
